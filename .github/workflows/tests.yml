name: tests

# The engine had no CI at all until 2026-08-19. Its tests existed and were run
# by hand, which meant they only ever caught what someone thought to check —
# and on the day this was added they had already caught, in one session, a
# return contract broken across two call sites, a guard silently dropped, and a
# prompt change that would have sent applications into a category the profile
# refuses. All three were found locally, none of them by anything automatic.
#
# Three of these tests DO drive a page — test_apply_click_detection,
# test_dom_first_match and test_vacancy_text_extraction call
# chromium.launch(headless=True) and run selectors against captured HTML. They
# reach no network; they need a real DOM because selector logic cannot be
# checked without one, and selector fragility is this project's largest known
# risk. So Chromium is installed. This header claimed the opposite until
# 2026-09-08, which is why the workflow was red from its first run and nobody
# looked: it said the failures were impossible.

on:
  push:
    branches: [dev, main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Keyed on requirements.txt because that is what pins the playwright
      # version, and the browser build has to match the driver that launches it.
      - name: Cache Chromium
        id: cache-browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ubuntu-latest-playwright-${{ hashFiles('requirements.txt') }}

      - name: Install Chromium
        if: steps.cache-browser.outputs.cache-hit != 'true'
        run: python -m playwright install --with-deps chromium

      # This repository is public, so this log is public. --ci prints which file
      # and which line, never the matched text: a scanner that echoes its finding
      # into a public log performs the leak it exists to prevent.
      - name: Scan for sensitive data
        run: python scripts/check_sensitive.py --ci

      - name: Run the engine's tests
        # Plain scripts, not pytest — each returns non-zero on failure and
        # prints its own checks. Run every one, then fail once at the end, so a
        # single early break does not hide the rest.
        run: |
          failed=0
          for t in tests/test_*.py; do
            echo "── $t"
            python "$t" || failed=1
          done
          exit $failed
